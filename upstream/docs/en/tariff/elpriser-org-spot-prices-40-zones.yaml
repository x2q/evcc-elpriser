template: elpriser
product:
  identifier: elpriser-org-spot-prices-40-zones
  brand: elpriser.org
  description: Spot prices (40 zones)
  group: Dynamic electricity price
countries: ["EU", "DK"]
requirements: ["skiptest"]
description: |
  Day-ahead electricity prices from [elpriser.org](https://elpriser.org) for 40 European bidding zones, including a forecast of up to 7-10 days (elpriser.org's own statistical model, not an official forecast). No account and no API key needed.
  Outside Denmark this is the wholesale price without taxes, levies and grid fees; add them with `charges`, `tax` or `formula`.
  For Denmark (dk1, dk2) the service can return the full consumer price including your grid company's tariff (mode `net_inkl_alt` plus the GLN number).
  Prices are in the zone's currency (DKK, SEK, NOK, PLN, GBP, ...); set the same currency in evcc, or choose EUR.

render:
  - default: |
      type: template
      template: elpriser
      zone: de # Price zone, The zones of the service: dk1 = Denmark - DK1 West (Jutland, Funen); dk2 = Denmark - DK2 East (Zealand, Bornholm); no1 = Norway - NO1 Oslo; no2 = Norway - NO2 Kristiansand; no3 = Norway - NO3 Trondheim; no4 = Norway - NO4 Tromsø; no5 = Norway - NO5 Bergen; se1 = Sweden - SE1 Luleå; se2 = Sweden - SE2 Sundsvall; se3 = Sweden - SE3 Stockholm; se4 = Sweden - SE4 Malmö; fi = Finland; nl = Netherlands; de = Germany and Luxembourg (DE-LU); fr = France; pl = Poland; it-n = Italy - North (IT-North); at = Austria; be = Belgium; ch = Switzerland; cz = Czechia; hu = Hungary; si = Slovenia; es = Spain; pt = Portugal; sk = Slovakia; gr = Greece; ro = Romania; bg = Bulgaria; hr = Croatia; rs = Serbia; ee = Estonia; lv = Latvia; lt = Lithuania; me = Montenegro; mk = North Macedonia; al = Albania; xk = Kosovo; gb = Great Britain (within-day market index, not day-ahead); ie = Ireland (all-island market). [dk1, dk2, no1, no2, no3, no4, no5, se1, se2, se3, se4, fi, nl, de, fr, pl, it-n, at, be, ch, cz, hu, si, es, pt, sk, gr, ro, bg, hr, rs, ee, lv, lt, me, mk, al, xk, gb, ie]
      currency: local # Currency, `local` = the zone's currency (DKK, SEK, NOK, PLN, ... converted with the ECB reference rate), `eur` = euro. Must match the currency set in evcc. Denmark is always DKK, Great Britain always GBP. [local, eur]
      pricemode: inkl_alt # Price type (Denmark only), Only for dk1 and dk2. `inkl_alt` = spot + Energinet tariffs + electricity duty + VAT (everything except your grid company's tariff); `net_inkl_alt` = the full price including your grid company's tariff, needs `gln`; `spot_ex` / `spot_inkl` = spot price without / with VAT. [inkl_alt, spot_inkl, spot_ex, inkl_alt_minus, inkl_alt_elvarme, net_inkl_alt, net_inkl_alt_elvarme, net_inkl_tarif] (optional)
      gln: 5790000705689 # Grid company GLN (Denmark only), 13-digit GLN number of your Danish grid company, only for the net_* price types. List: elpriser.org/tariffer (optional)
    advanced: |
      type: template
      template: elpriser
      zone: de # Price zone, The zones of the service: dk1 = Denmark - DK1 West (Jutland, Funen); dk2 = Denmark - DK2 East (Zealand, Bornholm); no1 = Norway - NO1 Oslo; no2 = Norway - NO2 Kristiansand; no3 = Norway - NO3 Trondheim; no4 = Norway - NO4 Tromsø; no5 = Norway - NO5 Bergen; se1 = Sweden - SE1 Luleå; se2 = Sweden - SE2 Sundsvall; se3 = Sweden - SE3 Stockholm; se4 = Sweden - SE4 Malmö; fi = Finland; nl = Netherlands; de = Germany and Luxembourg (DE-LU); fr = France; pl = Poland; it-n = Italy - North (IT-North); at = Austria; be = Belgium; ch = Switzerland; cz = Czechia; hu = Hungary; si = Slovenia; es = Spain; pt = Portugal; sk = Slovakia; gr = Greece; ro = Romania; bg = Bulgaria; hr = Croatia; rs = Serbia; ee = Estonia; lv = Latvia; lt = Lithuania; me = Montenegro; mk = North Macedonia; al = Albania; xk = Kosovo; gb = Great Britain (within-day market index, not day-ahead); ie = Ireland (all-island market). [dk1, dk2, no1, no2, no3, no4, no5, se1, se2, se3, se4, fi, nl, de, fr, pl, it-n, at, be, ch, cz, hu, si, es, pt, sk, gr, ro, bg, hr, rs, ee, lv, lt, me, mk, al, xk, gb, ie]
      currency: local # Currency, `local` = the zone's currency (DKK, SEK, NOK, PLN, ... converted with the ECB reference rate), `eur` = euro. Must match the currency set in evcc. Denmark is always DKK, Great Britain always GBP. [local, eur]
      pricemode: inkl_alt # Price type (Denmark only), Only for dk1 and dk2. `inkl_alt` = spot + Energinet tariffs + electricity duty + VAT (everything except your grid company's tariff); `net_inkl_alt` = the full price including your grid company's tariff, needs `gln`; `spot_ex` / `spot_inkl` = spot price without / with VAT. [inkl_alt, spot_inkl, spot_ex, inkl_alt_minus, inkl_alt_elvarme, net_inkl_alt, net_inkl_alt_elvarme, net_inkl_tarif] (optional)
      gln: 5790000705689 # Grid company GLN (Denmark only), 13-digit GLN number of your Danish grid company, only for the net_* price types. List: elpriser.org/tariffer (optional)
      actualonly: # Published prices only, Leaves out the days that are only a model forecast (the next day is a forecast until the day-ahead prices are published, around 13:00 CET). (optional)
      charges: # Charge, Additional fixed charge per kWh (optional)
      chargesZones: # Charges zones, Time-based grid fees that override the default charge. (optional)
      tax: # Tax, Additional percentage charge (e.g. 0.2 for 20%) (optional)
      formula: math.Max((price + charges) * (1 + tax), 0.0) # Formula, Individual formula for calculating the price (optional)
      average: # Average by hour, optional
