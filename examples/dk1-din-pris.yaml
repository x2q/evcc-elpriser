# Denmark DK1: "Din pris" = spot + Energinet tariffs + electricity duty + VAT, in DKK/kWh
# mode=inkl_alt is everything except your own grid company (netselskab) tariff.
# See dk2-netselskab.yaml for the full price with the grid tariff.
# Set zone=dk2 for Eastern Denmark. Settled days are 15-minute slots, the forecast days hourly.
#
# Merge the block into your evcc.yaml. Needs evcc with the "custom" tariff, a
# network connection to elpriser.org and nothing else: no account, no API key.
# Generated by scripts/build.mjs - do not edit by hand.
tariffs:
  currency: DKK
  grid:
    type: custom
    forecast:
      source: http
      uri: https://elpriser.org/api/slots?zone=dk1&mode=inkl_alt
      cache: 1h
      jq: |
        # elpriser.org /api/slots -> evcc rates ([{start, end, value}], value = currency per kWh)
        #
        # The service already delivers absolute UTC slots ({start, end, price, type}): 15 minutes
        # wherever the day-ahead market has 15-minute prices, hourly for the model's forecast days,
        # daylight saving handled server-side. Nothing is left to do here but to rename `price`.
        .slots | map({ start, end, value: .price }) | tostring
    interval: 1h
